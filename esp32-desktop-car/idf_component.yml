# ESP-IDF Component Manager manifest.
#
# `esp_peer` is contributed by the voiceagent-esp32 SDK via its own
# `[package.metadata.esp-idf-sys] extra_components` section, so it does not
# need to be listed here.
dependencies:
  espressif/esp_audio_codec:
    version: "~2.3.0"
  espressif/esp-sr:
    version: "^1.9.0"
  idf:
    version: ">=5.1.0"
